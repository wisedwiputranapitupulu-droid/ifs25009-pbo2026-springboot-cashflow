spring:
  application:
    name: ifs25009-pbo2026-springboot-cashflow
  main:
    banner-mode: off
  jmx:
    enabled: false
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  # Prioritas: APP_PORT (.env) -> PORT (diset otomatis oleh banyak platform hosting) -> 8080
  port: ${APP_PORT:${PORT:8080}}
  # Aplikasi berjalan di belakang reverse proxy (Nginx/Traefik); hindari 502 / redirect salah
  forward-headers-strategy: framework
  # Kompres respons teks (HTML/JS/CSS/JSON) -> halaman lebih ringan & audit "text compression" lolos
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
  # Tutup koneksi macet lebih cepat, hemat thread
  tomcat:
    keep-alive-timeout: 20s
    threads:
      max: 50
      min-spare: 4
  shutdown: graceful

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
